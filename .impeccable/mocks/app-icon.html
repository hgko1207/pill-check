<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>약똑똑 앱 아이콘 시안</title>
<style>
  :root {
    --bg: #F8F4EE; --surface: #FFFFFF; --text: #28221D; --muted: #5A5047;
    --border: #EAE2D5; --primary: #4A4FD0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1A1815; --surface: #25221F; --text: #F3EEE7; --muted: #C2B8AC; --border: #3A3530; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    word-break: keep-all; line-height: 1.55;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 28px; color: var(--muted); font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px; }
  .card h2 { font-size: 20px; margin: 0 0 4px; }
  .card p { margin: 0 0 16px; font-size: 15px; color: var(--muted); }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #EEECFB; color: #3A3EB0; margin-left: 6px; vertical-align: 2px; }
  .tag--old { background: #FDECEE; color: #8A1F2E; }
  .shapes { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
  .shapes figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
  .ios { width: 112px; height: 112px; border-radius: 25px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .android { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .tiny { width: 32px; height: 32px; border-radius: 8px; overflow: hidden; }
  .shapes svg { width: 100%; height: 100%; display: block; }
  .home { display: flex; gap: 14px; padding: 18px 14px 12px; border-radius: 16px; }
  .home--light { background: linear-gradient(160deg, #DCE6F2, #F3E6DA); }
  .home--dark { background: linear-gradient(160deg, #1C2330, #2B2024); margin-top: 8px; }
  .home figure { margin: 0; width: 60px; text-align: center; }
  .home .app { width: 60px; height: 60px; border-radius: 14px; overflow: hidden; }
  .home .app svg { width: 100%; height: 100%; display: block; }
  .home .ghost { width: 60px; height: 60px; border-radius: 14px; background: rgba(255,255,255,.55); }
  .home--dark .ghost { background: rgba(255,255,255,.14); }
  .home figcaption { font-size: 11px; margin-top: 4px; color: #1E1E1E; white-space: nowrap; }
  .home--dark figcaption { color: #F2F2F2; }
  .notes { margin-top: 32px; font-size: 15px; color: var(--muted); }
  .notes li { margin-bottom: 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 현재: 초록 + 체크 -->
    <symbol id="ic-old" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#1B5E20"/>
      <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="24"/>
      <path d="M180 256 L228 304 L332 200" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- A: 인디고 + 캡슐 한 알 -->
    <symbol id="ic-a" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#4A4FD0"/>
      <g transform="rotate(-45 256 256)">
        <path d="M170 192 h86 v128 h-86 a64 64 0 0 1 0 -128 z" fill="#FFFFFF"/>
        <path d="M256 192 h86 a64 64 0 0 1 0 128 h-86 z" fill="#B9BCF2"/>
      </g>
    </symbol>

    <!-- B: 인디고 + 돋보기 안의 캡슐 (확인) -->
    <symbol id="ic-b" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#4A4FD0"/>
      <line x1="318" y1="318" x2="382" y2="382" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
      <circle cx="232" cy="232" r="118" fill="#3A3EB0" stroke="#FFFFFF" stroke-width="32"/>
      <g transform="rotate(-45 232 232)">
        <path d="M182 196 h50 v72 h-50 a36 36 0 0 1 0 -72 z" fill="#FFFFFF"/>
        <path d="M232 196 h50 a36 36 0 0 1 0 72 h-50 z" fill="#B9BCF2"/>
      </g>
    </symbol>

    <!-- C: 인디고 + 두 알이 겹침 (함께 먹어도 되나) -->
    <symbol id="ic-c" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#4A4FD0"/>
      <g transform="rotate(45 256 256)">
        <rect x="116" y="200" width="280" height="112" rx="56" fill="#B9BCF2"/>
      </g>
      <g transform="rotate(-45 256 256)">
        <rect x="116" y="200" width="280" height="112" rx="56" fill="#FFFFFF" stroke="#4A4FD0" stroke-width="14"/>
        <line x1="256" y1="207" x2="256" y2="305" stroke="#4A4FD0" stroke-width="10"/>
      </g>
    </symbol>

    <!-- D: 인디고 + "약" 글자 -->
    <symbol id="ic-d" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#4A4FD0"/>
      <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        font-weight="800" font-size="250" fill="#FFFFFF" letter-spacing="-8">약</text>
    </symbol>

    <!-- E: 밝은 바탕 + 인디고 캡슐 -->
    <symbol id="ic-e" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#F8F4EE"/>
      <g transform="rotate(-45 256 256)">
        <path d="M170 192 h86 v128 h-86 a64 64 0 0 1 0 -128 z" fill="#4A4FD0"/>
        <path d="M256 192 h86 a64 64 0 0 1 0 128 h-86 z" fill="#B9BCF2"/>
      </g>
    </symbol>
  </defs>
</svg>

<main>
  <h1>약똑똑 앱 아이콘 시안</h1>
  <p class="lead">홈 화면에서 아이폰(둥근 사각), 안드로이드(원), 탭 아이콘(작게) 모양으로 잘라 본 모습입니다. 아래 홈 화면은 밝은 배경화면과 어두운 배경화면 두 가지예요.</p>

  <div class="grid" id="grid"></div>

  <ul class="notes">
    <li>체크 표시는 "안전하다"로 읽힐 수 있어서 새 시안에서는 쓰지 않았습니다.</li>
    <li>D("약" 글자)는 실제 아이콘으로 만들 때 글자를 도형으로 바꿔서 글꼴에 영향받지 않게 합니다.</li>
    <li>안드로이드 원 모양은 가운데 80% 안만 보장되므로 그림을 모두 그 안에 넣었습니다.</li>
  </ul>
</main>

<script>
  const variants = [
    { id: 'ic-old', name: '현재', tag: '지금 쓰는 것', old: true, desc: '초록 + 체크. 예전 디자인 색이고, 체크가 "안전"으로 읽힐 수 있어요.' },
    { id: 'ic-a', name: 'A. 캡슐 한 알', desc: '브랜드 인디고 + 캡슐. 가장 단순해서 작게 봐도 바로 "약 앱"으로 보여요.' },
    { id: 'ic-b', name: 'B. 돋보기 + 캡슐', desc: '"약을 확인한다"는 뜻이 드러나요. 대신 작은 크기에서는 조금 복잡해요.' },
    { id: 'ic-c', name: 'C. 두 알이 겹침', desc: '"같이 먹어도 되나"라는 앱의 핵심을 보여 줘요. 겹치는 모양이 X처럼 읽힐 수도 있어요.' },
    { id: 'ic-d', name: 'D. "약" 글자', desc: '60대가 홈 화면에서 찾기 가장 쉬워요. 다른 약국 앱과 비슷해 보일 수 있어요.' },
    { id: 'ic-e', name: 'E. 밝은 바탕 캡슐', desc: 'A의 반전. 앱 바탕색과 같아서 시작 화면과 자연스럽게 이어지지만, 밝은 배경화면에서는 덜 눈에 띄어요.' },
  ]
  const use = (id) => `<svg viewBox="0 0 512 512"><use href="#${id}"/></svg>`
  const home = (id, cls) => `
    <div class="home ${cls}">
      <figure><div class="ghost"></div><figcaption>메시지</figcaption></figure>
      <figure><div class="app">${use(id)}</div><figcaption>약똑똑</figcaption></figure>
      <figure><div class="ghost"></div><figcaption>카메라</figcaption></figure>
      <figure><div class="ghost"></div><figcaption>날씨</figcaption></figure>
    </div>`
  document.getElementById('grid').innerHTML = variants.map(v => `
    <section class="card">
      <h2>${v.name}${v.tag ? `<span class="tag ${v.old ? 'tag--old' : ''}">${v.tag}</span>` : ''}</h2>
      <p>${v.desc}</p>
      <div class="shapes">
        <figure><div class="ios">${use(v.id)}</div>아이폰</figure>
        <figure><div class="android">${use(v.id)}</div>안드로이드</figure>
        <figure><div class="tiny">${use(v.id)}</div>탭</figure>
      </div>
      ${home(v.id, 'home--light')}
      ${home(v.id, 'home--dark')}
    </section>`).join('')
</script>
</body>
</html>
